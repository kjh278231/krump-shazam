<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="library_page_title">Krump Track Finder</title>
<link rel="icon" href="icons/icon32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="library.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="title-block">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>
          </span>
          <span class="wordmark">Krump Track Finder</span>
        </div>
        <h1 data-i18n="library_heading"></h1>
        <div id="summary" class="stats"></div>
      </div>
      <div class="search">
        <label for="search" data-i18n="search_label"></label>
        <div class="field">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" data-i18n-placeholder="search_placeholder" autocomplete="off">
        </div>
      </div>
    </header>
    <div class="bar">
      <div id="filters" class="filters" role="group" data-i18n-aria-label="filters_label">
        <button type="button" data-f="all" aria-pressed="true" data-i18n="filter_all"></button>
        <button type="button" data-f="buy" aria-pressed="false" data-i18n="filter_buy"></button>
        <button type="button" data-f="none" aria-pressed="false" data-i18n="no_store"></button>
      </div>
      <span id="shown" class="shown"></span>
    </div>
    <div id="status" role="status"></div>
    <main id="albums"></main>
  </div>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="library.js"></script>
</body>
</html>
