<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Krump Track Finder</h1>
    <span class="tools">
      <button id="library" title="라이브러리에 있는 앨범 보기">라이브러리</button>
      <span id="server" class="dot" title="서버 상태"></span>
    </span>
  </header>

  <section id="controls">
    <label>녹음 길이
      <select id="duration">
        <option value="10">10초</option>
        <option value="20">20초</option>
        <option value="30" selected>30초</option>
        <option value="45">45초</option>
      </select>
    </label>
    <button id="start">현재 탭에서 찾기</button>
    <button id="stop" hidden>지금 멈추고 검색</button>
  </section>

  <section id="status"></section>
  <section id="result"></section>
  <audio id="player" controls hidden></audio>

  <details id="settings">
    <summary>서버 설정</summary>
    <label>주소 <input id="server-url" type="url" placeholder="http://127.0.0.1:8765"></label>
    <label>API 키 <input id="api-key" type="password" placeholder="로컬 서버는 비워 두세요"></label>
    <button id="save-settings">저장</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
